[pytest]
# Collect both the legacy hand-rolled modules (lib_*.py, with a `test()` entry)
# and idiomatic pytest modules (test_*.py, with `test_*` functions).
python_files = lib_*.py test_*.py
python_functions = test test_*
python_classes = Test*
# Async tests (the repo / limits / validator / schema layers are all async) need
# no per-test decorator.
asyncio_mode = auto
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
