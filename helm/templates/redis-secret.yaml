{{- if and .Values.redis.enabled .Values.redis.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redisName" . }}-auth
  labels:
    app: {{ include "name" . }}
    component: redis
    chart: {{ include "chart" . }}
  {{- with .Values.secretAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  # Consumed by the bundled Redis container (--requirepass) and its
  # readinessProbe (REDISCLI_AUTH).
  REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  # Full connection URL (password included) handed to the YAC pod as
  # YAC_ENV__REDIS_URL, available in the specs file as `env.redis_url`.
  YAC_ENV__REDIS_URL: {{ include "redisUrl" . | quote }}
{{- end }}
